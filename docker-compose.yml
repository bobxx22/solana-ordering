services:
  ordering:
    build: .
    image: solana-ordering:local
    env_file:
      - path: .env
        required: false
    volumes:
      # raw data and results live in the repository so they can be verified
      - ./data:/app/data
      # wallet files never enter the image; mounted only from the host
      - ./keys:/app/keys
    command: ['help']
