# Proves on a clean machine that the project builds and runs: unit tests on Node, then the Docker image
# through docker compose. No keys and no network sends are involved.
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.0'
      - run: npm test

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
      - name: cli runs in the container
        run: docker compose run --rm ordering help
      - name: tests run in the container
        run: docker compose run --rm --entrypoint node ordering --test test/
